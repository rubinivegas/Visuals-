<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaccines Help Everyone!</title>
<style>
  :root {
    --ink: #2b3a55;
    --bg: #fff6e5;
    --card: #ffffff;
    --accent: #ff6f91;
    --accent-dark: #d94a6f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  h1 { margin: 4px 0 0; font-size: clamp(1.4rem, 4vw, 2.2rem); text-align: center; }
  .stage {
    width: min(100%, 900px);
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(43, 58, 85, .18);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }
  .caption {
    min-height: 4.6em;
    padding: 14px 20px;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    text-align: center;
    background: #eaf6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .3s;
  }
  button {
    font: inherit;
    font-size: 1.1rem;
    padding: 10px 26px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }

  /* ---------- scenes ---------- */
  .scene { opacity: 0; transition: opacity .7s; pointer-events: none; }
  .scene.active { opacity: 1; }

  /* faces: states accumulate (idle -> approach -> poke -> done), later rules win */
  .m-worry, .m-ouch, .m-happy, .eyes-squint, .bub, .shield, .hearts { display: none; }
  .approach .m-idle { display: none; }
  .approach .m-worry { display: inline; }
  .poke .m-worry { display: none; }
  .poke .m-ouch { display: inline; }
  .poke .eyes-open { display: none; }
  .poke .eyes-squint { display: inline; }
  .poke .bub-poke { display: inline; }
  .done .m-ouch { display: none; }
  .done .m-happy { display: inline; }
  .done .eyes-squint { display: none; }
  .done .eyes-open { display: inline; }
  .done .bub-poke { display: none; }
  .done .bub-done { display: inline; }
  .done .hearts { display: inline; }
  .shield { display: inline; opacity: 0; transform: scale(0); transform-box: fill-box; transform-origin: center; transition: transform .6s cubic-bezier(.3, 1.6, .5, 1), opacity .3s; }
  .shielded .shield { opacity: 1; transform: scale(1); }
  .shielded .bub-done { display: none; }

  /* syringe moves along its own axis (local +x points back toward the helper) */
  .syr { transform: translateX(170px); transition: transform 1.4s ease-in-out; }
  .approach .syr { transform: translateX(110px); }
  .poke .syr { transform: translateX(0); transition-duration: .5s; }
  .done .syr { transform: translateX(170px); transition-duration: 1.2s; }
  .plunger { transition: transform 1s ease-in; }
  .poke .plunger { transform: translateX(-48px); }
  .liquid { transform-box: fill-box; transform-origin: left center; transition: transform 1s ease-in; }
  .poke .liquid { transform: scaleX(.12); }
  .bandage { opacity: 0; transform: scale(.3); transform-box: fill-box; transform-origin: center; transition: opacity .4s, transform .4s cubic-bezier(.3, 1.6, .5, 1); }
  .done .bandage { opacity: 1; transform: scale(1); }

  /* idle life */
  .breathe { animation: breathe 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes breathe { 50% { transform: scaleY(1.02); } }
  .tail { transform-box: view-box; transform-origin: 250px 320px; animation: wag 1.4s ease-in-out infinite; }
  .done .tail { animation-duration: .25s; }
  @keyframes wag { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  .ear-l { transform-box: fill-box; transform-origin: center top; animation: ear 2s ease-in-out infinite; }
  .ear-r { transform-box: fill-box; transform-origin: center top; animation: ear 2s ease-in-out infinite reverse; }
  @keyframes ear { 50% { transform: rotate(5deg); } }
  .heart { animation: floatup 2.2s ease-in infinite; opacity: 0; }
  g:nth-child(2) > .heart { animation-delay: .7s; }
  g:nth-child(3) > .heart { animation-delay: 1.4s; }
  @keyframes floatup { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
  .bounce { animation: bounce 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes bounce { 50% { transform: translateY(-14px); } }
  text { font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; }

  @media (prefers-reduced-motion: reduce) {
    .breathe, .tail, .ear-l, .ear-r, .heart, .bounce { animation: none; }
  }
</style>
</head>
<body>

      <ellipse cx="316" cy="216" rx="30" ry="22" fill="#f6dfc0"/>

<div class="caption" id="caption" aria-live="polite"></div>

<button id="replay" type="button">↻ Watch again</button>

<script>
(function () {
  // Shared syringe drawing. Local origin = needle tip; +x points back to the helper's hand.
  var syringe =
    '<g class="plunger"><rect x="104" y="-3" width="46" height="6" fill="#9aa8b5"/>' +
    '<rect x="98" y="-9" width="6" height="18" fill="#6f7f8f"/><rect x="148" y="-13" width="6" height="26" rx="2" fill="#6f7f8f"/>' +
    '<circle class="hand" cx="158" cy="0" r="15" fill="#e0b48c"/></g>' +
    '<rect x="34" y="-11" width="68" height="22" rx="4" fill="#eaf6ff" stroke="#5b7388" stroke-width="2.5"/>' +
    '<rect class="liquid" x="38" y="-7" width="60" height="14" fill="#ff6fa5"/>' +
    '<rect x="94" y="-14" width="5" height="28" rx="2" fill="#5b7388"/>' +
    '<rect x="26" y="-5" width="9" height="10" fill="#8aa0b4"/>' +
    '<line x1="0" y1="0" x2="27" y2="0" stroke="#8d99a6" stroke-width="3" stroke-linecap="round"/>';
  document.getElementById('syr1').innerHTML = syringe;
  document.getElementById('syr2').innerHTML = syringe;

  var scenes = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];

  // Bend each helper's arm from a fixed shoulder to the moving hand (simple two-bone IK).
  var svgEl = document.getElementById('svg');
  var SHOULDER = { x: 634, y: 190 }, BONE = 95;
  function drawArms() {
    [scenes[0], scenes[1]].forEach(function (sc) {
      var hand = sc.querySelector('.hand');
      var m = svgEl.getScreenCTM().inverse().multiply(hand.getScreenCTM());
      var h = new DOMPoint(158, 0).matrixTransform(m);
      var dx = h.x - SHOULDER.x, dy = h.y - SHOULDER.y;
      var d = Math.min(Math.hypot(dx, dy), BONE * 2 - 1);
      var a = Math.atan2(dy, dx), bend = Math.acos(d / (BONE * 2));
      // elbow hangs below the shoulder-hand line
      var ex = SHOULDER.x + BONE * Math.cos(a - bend), ey = SHOULDER.y + BONE * Math.sin(a - bend);
      if (ey < SHOULDER.y + BONE * Math.sin(a + bend)) {
        ex = SHOULDER.x + BONE * Math.cos(a + bend); ey = SHOULDER.y + BONE * Math.sin(a + bend);
      }
      var path = 'M' + SHOULDER.x + ' ' + SHOULDER.y + ' L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ' L' + h.x.toFixed(1) + ' ' + h.y.toFixed(1);
      sc.querySelectorAll('.arm path').forEach(function (p) { p.setAttribute('d', path); });
    });
    requestAnimationFrame(drawArms);
  }
  requestAnimationFrame(drawArms);
  var cap = document.getElementById('caption');
  var timers = [];

  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function say(text) { cap.textContent = text; }
  function show(i) {
    scenes.forEach(function (s, k) { s.classList.toggle('active', k === i); });
  }
  function reset() {
    scenes.forEach(function (s) { s.classList.remove('approach', 'poke', 'done', 'shielded'); });
  }
  function step(i, cls) { scenes[i].classList.add(cls); }

  function play() {
    timers.forEach(clearTimeout);
    timers = [];
    // snap the syringe back instantly while hidden, then start
    reset();
    show(0);

    // --- the child ---
    say('This is Maya. Today is her vaccine day! 💉');
    at(3500,  function () { say('The doctor uses a tiny, tiny needle.'); step(0, 'approach'); });
    at(6500,  function () { say('Pinch! It is over super fast.'); step(0, 'poke'); });
    at(8200,  function () { say('All done! Maya was so brave. A bandage and a sticker! ⭐'); step(0, 'done'); });
    at(11500, function () { say('The vaccine teaches her body to fight germs, so she stays healthy. 🛡️'); step(0, 'shielded'); });

    // --- the puppy ---
    at(15500, function () { show(1); say('Dogs need vaccines too! This is Biscuit the puppy. 🐶'); });
    at(19000, function () { say('The vet gives Biscuit a tiny pinch, just like Maya got.'); step(1, 'approach'); });
    at(22000, function () { say('Yip! Quick pinch...'); step(1, 'poke'); });
    at(23700, function () { say('All done! Good boy, Biscuit! A paw-print bandage! 🐾'); step(1, 'done'); });
    at(27000, function () { say('Now Biscuit is protected from germs too. 🛡️'); step(1, 'shielded'); });

    // --- together ---
    at(31000, function () { show(2); say('Just like kids, dogs need vaccines to stay healthy and play with us!'); });
  }

  document.getElementById('replay').addEventListener('click', play);
  play();
})();
</script>
