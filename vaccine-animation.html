<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaccines Help Everyone!</title>
<style>
  :root {
    --ink: #2b3a55;
    --bg: #fff6e5;
    --card: #ffffff;
    --accent: #ff6f91;
    --accent-dark: #d94a6f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 12px;
  }
  .stage {
    width: min(100%, 900px);
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(43, 58, 85, .18);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }
  .caption {
    min-height: 4.6em;
    padding: 14px 20px;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    text-align: center;
    background: #eaf6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .3s;
  }

  /* ---------- scenes ---------- */
  .scene { opacity: 0; transition: opacity .7s; pointer-events: none; }
  .scene.active { opacity: 1; }

  /* faces: states accumulate (idle -> approach -> poke -> done), later rules win */
  .m-worry, .m-ouch, .m-happy, .eyes-squint, .bub, .shield, .hearts { display: none; }
  .approach .m-idle { display: none; }
  .approach .m-worry { display: inline; }
  .poke .m-worry { display: none; }
  .poke .m-ouch { display: inline; }
  .poke .eyes-open { display: none; }
  .poke .eyes-squint { display: inline; }
  .poke .bub-poke { display: inline; }
  .done .m-ouch { display: none; }
  .done .m-happy { display: inline; }
  .done .eyes-squint { display: none; }
  .done .eyes-open { display: inline; }
  .done .bub-poke { display: none; }
  .done .bub-done { display: inline; }
  .done .hearts { display: inline; }
  .shield { display: inline; opacity: 0; transform: scale(0); transform-box: fill-box; transform-origin: center; transition: transform .6s cubic-bezier(.3, 1.6, .5, 1), opacity .3s; }
  .shielded .shield { opacity: 1; transform: scale(1); }
  .shielded .bub-done { display: none; }

  .idle-arm { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.2s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(-3deg); } }
  button {
    font: inherit;
    font-size: 1.1rem;
    padding: 10px 26px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
  .snap * { transition: none !important; }
  .plunger { transition: transform 1s ease-in; }
  .poke .plunger { transform: translateX(-48px); }
  .liquid { transform-box: fill-box; transform-origin: left center; transition: transform 1s ease-in; }
  .poke .liquid { transform: scaleX(.12); }
  .bandage { opacity: 0; transform: scale(.3); transform-box: fill-box; transform-origin: center; transition: opacity .4s, transform .4s cubic-bezier(.3, 1.6, .5, 1); }
  .done .bandage { opacity: 1; transform: scale(1); }

  /* idle life */
  .breathe { animation: breathe 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes breathe { 50% { transform: scaleY(1.02); } }
  .tail { transform-box: view-box; transform-origin: 250px 320px; animation: wag 1.4s ease-in-out infinite; }
  .done .tail { animation-duration: .25s; }
  @keyframes wag { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  .ear-l { transform-box: fill-box; transform-origin: 70% 100%; animation: ear 2s ease-in-out infinite; }
  .ear-r { transform-box: fill-box; transform-origin: 30% 100%; animation: ear 2s ease-in-out infinite reverse; }
  @keyframes ear { 50% { transform: rotate(4deg); } }
  .heart { animation: floatup 2.2s ease-in infinite; opacity: 0; }
  g:nth-child(2) > .heart { animation-delay: .7s; }
  g:nth-child(3) > .heart { animation-delay: 1.4s; }
  @keyframes floatup { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
  text { font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; }

  @media (prefers-reduced-motion: reduce) {
    .breathe, .idle-arm, .tail, .ear-l, .ear-r, .heart { animation: none; }
  }
</style>
</head>
<body>

<svg id="svg" viewBox="0 0 800 450" role="img" aria-label="Animation of a child, Maya, and then a puppy, Stella, getting vaccines">

    </g>

    <!-- bandage on arm -->
    <g transform="translate(368 287) rotate(70)"><g class="bandage">

      <path d="M-22 0 L-6 18 L24 -18" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= SCENE 2: PUPPY ================= -->

        <!-- front legs: black at the top, tan below, white paws -->
        <rect x="268" y="326" width="34" height="50" rx="16" fill="#23262b"/><rect x="334" y="326" width="34" height="50" rx="16" fill="#23262b"/>
        <rect x="270" y="340" width="30" height="34" rx="12" fill="#c9823f"/><rect x="336" y="340" width="30" height="34" rx="12" fill="#c9823f"/>
        <ellipse cx="285" cy="374" rx="20" ry="10" fill="#f7f4ee"/><ellipse cx="351" cy="374" rx="20" ry="10" fill="#f7f4ee"/>
      </g>
      <!-- soft folded ears, tan inside -->
      <g class="ear-l"><path d="M258 170 L250 118 Q262 104 298 138Z" fill="#23262b"/><path d="M262 160 L258 128 Q266 120 286 140Z" fill="#c9823f"/><path d="M250 118 Q262 104 276 116 L266 136Z" fill="#15171a"/></g>
      <g class="ear-r"><path d="M374 170 L382 118 Q370 104 334 138Z" fill="#23262b"/><path d="M370 160 L374 128 Q366 120 346 140Z" fill="#c9823f"/><path d="M382 118 Q370 104 356 116 L366 136Z" fill="#15171a"/></g>
      <!-- head -->
      <circle cx="316" cy="190" r="60" fill="#23262b"/>
      <ellipse cx="292" cy="166" rx="8" ry="5" fill="#c9823f"/><ellipse cx="340" cy="166" rx="8" ry="5" fill="#c9823f"/>
      <path d="M262 198 Q270 236 302 240 L304 214 Q284 214 270 196Z" fill="#c9823f"/>
      <path d="M370 198 Q362 236 330 240 L328 214 Q348 214 362 196Z" fill="#c9823f"/>
      <ellipse cx="316" cy="219" rx="25" ry="19" fill="#c9823f"/>
      <ellipse cx="316" cy="211" rx="15" ry="11" fill="#33373d"/>
      <ellipse cx="316" cy="232" rx="13" ry="7" fill="#d9d2c6"/>
      <ellipse cx="316" cy="205" rx="10" ry="7" fill="#0f1012"/>
      <!-- blue collar -->

        <circle cx="297" cy="180" r="2.5" fill="#fff"/><circle cx="341" cy="180" r="2.5" fill="#fff"/></g>
      <g class="eyes-squint" fill="none" stroke="#c9823f" stroke-width="4" stroke-linecap="round">
        <path d="M286 177 L300 184 L286 191"/><path d="M346 177 L332 184 L346 191"/></g>
      <path class="m-idle" d="M304 224 Q316 233 328 224" fill="none" stroke="#120c08" stroke-width="3.5" stroke-linecap="round"/>
      <path class="m-worry" d="M305 229 Q316 221 327 229" fill="none" stroke="#120c08" stroke-width="3.5" stroke-linecap="round"/>

    <!-- bandage with paw -->
    <g transform="translate(380 256) rotate(-30)"><g class="bandage">

      <rect x="-10" y="-11" width="20" height="22" fill="#fff"/>

    </g></g>

    <!-- hearts -->

      <g transform="translate(240 150)"><path class="heart" d="M0 8 C-14 -6 -6 -18 0 -8 C6 -18 14 -6 0 8Z"/></g>
      <g transform="translate(395 130)"><path class="heart" d="M0 8 C-14 -6 -6 -18 0 -8 C6 -18 14 -6 0 8Z"/></g>
      <g transform="translate(320 105)"><path class="heart" d="M0 8 C-14 -6 -6 -18 0 -8 C6 -18 14 -6 0 8Z"/></g>
    </g>
    </g>

    <!-- vet (built by script) -->

    <!-- bubbles -->

</svg>
<div class="caption" id="caption" aria-live="polite"></div>
</div>

<button id="replay" type="button">↻ Watch again</button>

<script>
(function () {
  // Shared syringe drawing. Local origin = needle tip; +x points back to the hand (thumb on plunger).
  var syringe =
    '<g class="plunger"><rect x="104" y="-3" width="46" height="6" fill="#9aa8b5"/>' +
    '<rect x="98" y="-9" width="6" height="18" fill="#6f7f8f"/><rect x="148" y="-13" width="6" height="26" rx="2" fill="#6f7f8f"/>' +
    '<circle class="hand" cx="158" cy="0" r="19"/></g>' +
    '<rect x="34" y="-11" width="68" height="22" rx="4" fill="#eaf6ff" stroke="#5b7388" stroke-width="2.5"/>' +
    '<rect class="liquid" x="38" y="-7" width="60" height="14" fill="#ff6fa5"/>' +
    '<rect x="94" y="-14" width="5" height="28" rx="2" fill="#5b7388"/>' +
    '<rect x="26" y="-5" width="9" height="10" fill="#8aa0b4"/>' +
    '<line x1="0" y1="0" x2="27" y2="0" stroke="#8d99a6" stroke-width="3" stroke-linecap="round"/>';

  // Adult helper figure, built around x = 0 and placed at HELPER_X.
  var HELPER_X = 470;
  var LOOKS = {
    nurse: { coat: '#ffffff', line: '#b9d3e3', shirt: '#7fd1c7', pants: '#5bbfb3', skin: '#d9a77f', hair: '#2f2a2a' },
    vet:   { coat: '#7fd1c7', line: '#4fa89d', shirt: '#ffffff', pants: '#3b4a66', skin: '#f2c9a0', hair: '#8a5a2b' }
  };
  function helperSVG(kind) {
    var c = LOOKS[kind];
    var limb = function (d, w) {
      return '<path d="' + d + '" fill="none" stroke="' + c.line + '" stroke-width="' + (w + 6) + '" stroke-linecap="round" stroke-linejoin="round"/>' +
             '<path d="' + d + '" fill="none" stroke="' + c.coat + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
    };
    // 3/4 view facing left (toward the patient). Face, collar and coat opening sit toward the left;
    // only the far-side ear shows. The leading (far) arm does the work; the near arm hangs relaxed.
    var cap = kind === 'nurse'
      ? '<path d="M-36 50 Q-34 34 -6 33 Q20 34 24 50Z" fill="#fff" stroke="' + c.line + '" stroke-width="2"/>' +
        '<rect x="-17" y="36" width="7" height="11" fill="#ff6f91"/><rect x="-21" y="39" width="15" height="5" fill="#ff6f91"/>'
      : '';
    var steth = kind === 'vet'
      ? '<path d="M-24 131 Q-30 194 -12 200 Q6 194 2 131" fill="none" stroke="#3b4a66" stroke-width="4"/>' +
        '<circle cx="-12" cy="203" r="7" fill="#cfd8e3" stroke="#3b4a66" stroke-width="3"/>'
      : '';
    // near arm: same bone lengths as the working arm (upper 62, forearm 58), elbow slightly back
    var nearArm = 'M30 150 L36 211.7 L31 269.5';
    return (
      // working arm (bent by script) sits behind the torso, like a far arm should
      '<g class="arm">' + limb('', 18) + '</g>' +
      '<g transform="translate(' + HELPER_X + ' 0)">' +
      // legs: far leg a touch darker and set back; shoes point toward the patient
      '<rect x="-24" y="300" width="20" height="116" rx="9" fill="' + c.pants + '" style="filter: brightness(.85)"/>' +
      '<ellipse cx="-24" cy="419" rx="18" ry="8" fill="#2c2c2c"/>' +
      '<rect x="-2" y="300" width="21" height="118" rx="9" fill="' + c.pants + '"/>' +
      '<ellipse cx="0" cy="421" rx="19" ry="8" fill="#3a3a3a"/>' +
      // neck and coat
      '<rect x="-14" y="106" width="18" height="28" fill="' + c.skin + '"/>' +
      '<path d="M-34 146 Q-32 131 -18 129 L22 129 Q40 131 42 146 L48 332 L-44 332Z" fill="' + c.coat + '" stroke="' + c.line + '" stroke-width="3"/>' +
      '<path d="M-24 129 L-12 164 L2 129Z" fill="' + c.shirt + '"/>' +
      '<path d="M-24 129 L-16 188 M2 129 L-8 188 M-12 164 L-12 332" fill="none" stroke="' + c.line + '" stroke-width="3"/>' +
      '<rect x="8" y="245" width="22" height="18" rx="3" fill="none" stroke="' + c.line + '" stroke-width="3"/>' + steth +
      '<g class="idle-arm">' + limb(nearArm, 18) + '<circle cx="31" cy="275" r="11.4" fill="' + c.skin + '"/></g>' +
      // head turned toward the patient
      '<circle cx="24" cy="86" r="7" fill="' + c.skin + '"/>' +
      '<circle cx="-4" cy="80" r="36" fill="' + c.skin + '"/>' +
      '<circle cx="-39" cy="88" r="5" fill="' + c.skin + '"/>' +
      '<path d="M-38 70 Q-36 40 -4 41 Q34 40 34 80 Q34 96 26 104 Q28 80 18 66 Q-8 58 -38 70Z" fill="' + c.hair + '"/>' + cap +
      '<circle cx="24" cy="86" r="7" fill="' + c.skin + '"/>' +
      '<ellipse cx="-26" cy="82" rx="3.5" ry="4.5" fill="#2b2b2b"/><circle cx="-6" cy="82" r="4.5" fill="#2b2b2b"/>' +
      '<circle cx="2" cy="95" r="5.5" fill="#ff9aa8" opacity=".5"/>' +
      '<path d="M-26 97 Q-18 104 -10 97" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>' +
      '</g>' +
      '<g class="syrpose"><g style="transform: scale(.6)">' + syringe + '</g></g>');
  }

  var scenes = [document.getElementById('s1'), document.getElementById('s2')];
  var svgEl = document.getElementById('svg');
  var rigs = [0, 1].map(function (i) {
    var host = scenes[i].querySelector('.helper');
    host.innerHTML = helperSVG(host.dataset.kind);
    host.querySelector('.hand').setAttribute('fill', LOOKS[host.dataset.kind].skin);
    return { host: host, pose: null, from: null, to: null, t0: 0, dur: 1 };
  });

  // Poses place the hand (x, y) and the syringe angle a (degrees). Blending hand positions keeps
  // every in-between frame inside the arm's reach, so the arm never has to stretch.
  var GRIP = 158 * 0.6;              // tip -> hand distance at this scale
  var SHOT = [{ x: 350, y: 307 }, { x: 361, y: 289 }];   // child's upper arm, puppy's shoulder
  var PUSH = 48 * 0.6;               // how far the thumb travels when the plunger is pressed
  function restPose(i) {             // arm hanging relaxed, syringe held low by the hip
    // after the shot the plunger stays pressed, so offset the grip to keep the thumb at the same spot
    var a = -110, r = a * Math.PI / 180, push = i != null && scenes[i].classList.contains('poke') ? PUSH : 0;
    return { x: HELPER_X - 46 + push * Math.cos(r), y: 266 + push * Math.sin(r), a: a };
  }
  function shotPose(i, back) {       // hand on the line of the needle, `back` px from the skin
    var a = -60, r = a * Math.PI / 180;
    return { x: SHOT[i].x + (GRIP + back) * Math.cos(r), y: SHOT[i].y + (GRIP + back) * Math.sin(r), a: a };
  }
  function moveTo(i, pose, dur) {
    var rig = rigs[i];
    rig.from = rig.pose; rig.to = pose; rig.t0 = performance.now(); rig.dur = dur;
  }
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  // Two-bone IK: upper arm and forearm keep their lengths; in this 3/4 view the elbow points back and down.
  var SHOULDER = { x: HELPER_X - 30, y: 150 }, UPPER = 62, FORE = 58;
  function frame(now) {
    rigs.forEach(function (rig) {
      if (rig.to) {
        var t = Math.min(1, (now - rig.t0) / rig.dur), k = ease(t);
        rig.pose = {
          x: rig.from.x + (rig.to.x - rig.from.x) * k,
          y: rig.from.y + (rig.to.y - rig.from.y) * k,
          a: rig.from.a + (rig.to.a - rig.from.a) * k
        };
        if (t === 1) rig.to = null;
      }
      var p = rig.pose, pr = p.a * Math.PI / 180;
      var tx = p.x - GRIP * Math.cos(pr), ty = p.y - GRIP * Math.sin(pr);
      rig.host.querySelector('.syrpose').setAttribute('transform', 'translate(' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ') rotate(' + p.a.toFixed(2) + ')');

      var hand = rig.host.querySelector('.hand');
      var h = new DOMPoint(158, 0).matrixTransform(svgEl.getScreenCTM().inverse().multiply(hand.getScreenCTM()));
      var dx = h.x - SHOULDER.x, dy = h.y - SHOULDER.y;
      var d = Math.max(UPPER - FORE + 1, Math.min(Math.hypot(dx, dy), UPPER + FORE - 0.5));
      var a = Math.atan2(dy, dx);
      var b = Math.acos((UPPER * UPPER + d * d - FORE * FORE) / (2 * UPPER * d));
      var ex = SHOULDER.x + UPPER * Math.cos(a - b), ey = SHOULDER.y + UPPER * Math.sin(a - b);
      var path = 'M' + SHOULDER.x + ' ' + SHOULDER.y + ' L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ' L' + h.x.toFixed(1) + ' ' + h.y.toFixed(1);
      rig.host.querySelectorAll('.arm path').forEach(function (el) { el.setAttribute('d', path); });
    });
    requestAnimationFrame(frame);
  }
  var cap = document.getElementById('caption');
  var timers = [];

  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function say(text) { cap.textContent = text; }
  function show(i) {
    scenes.forEach(function (s, k) { s.classList.toggle('active', k === i); });
  }
  function reset() {
    // snap everything back instantly (no transitions) so the loop restarts cleanly
    scenes.forEach(function (s) {
      s.classList.add('snap');
      s.classList.remove('approach', 'poke', 'done', 'shielded');
    });
    void svgEl.getBoundingClientRect();
    scenes.forEach(function (s) { s.classList.remove('snap'); });
    rigs.forEach(function (rig) { rig.pose = restPose(); rig.to = null; });
  }
  function step(i, cls) {
    scenes[i].classList.add(cls);
    if (cls === 'approach') moveTo(i, shotPose(i, 25), 1400);
    if (cls === 'poke') moveTo(i, shotPose(i, 0), 500);
    if (cls === 'done') moveTo(i, restPose(i), 1300);
  }

  function play() {
    timers.forEach(clearTimeout);
    timers = [];
    reset();
    show(0);

    // --- the child ---
    say('This is Maya. Today is her vaccine day! 💉');
    at(3500,  function () { say('The doctor uses a tiny, tiny needle.'); step(0, 'approach'); });
    at(6500,  function () { say('Pinch! It is over super fast.'); step(0, 'poke'); });
    at(8200,  function () { say('All done! Maya was so brave. A bandage and a sticker! ⭐'); step(0, 'done'); });
    at(11500, function () { say('The vaccine teaches her body to fight germs, so she stays healthy. 🛡️'); step(0, 'shielded'); });

    // --- the puppy ---
    at(15500, function () { show(1); say('Dogs need vaccines too! This is Stella, an Australian Shepherd puppy. 🐶'); });
    at(19000, function () { say('The vet gives Stella a tiny pinch, just like Maya got.'); step(1, 'approach'); });
    at(22000, function () { say('Yip! Quick pinch...'); step(1, 'poke'); });
    at(23700, function () { say('All done! Good pup, Stella! A paw-print bandage! 🐾'); step(1, 'done'); });
    at(27000, function () { say('Now Stella is protected from germs too. 🛡️'); step(1, 'shielded'); });

  }

  document.getElementById('replay').addEventListener('click', play);
  play();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
